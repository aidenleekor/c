<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>이상배 · 부산일보 기자</title>
<meta property="og:type" content="website">
<meta property="og:title" content="이상배 · 부산일보 기자">
<meta property="og:description" content="부산일보 이상배 기자 디지털 명함입니다. 탭하여 명함을 확인하고 저장하세요.">
<meta property="og:image" content="https://aidenleekor.github.io/c/card.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="717">
<meta property="og:url" content="https://aidenleekor.github.io/c/">
<meta property="og:site_name" content="부산일보">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="이상배 · 부산일보 기자">
<meta name="twitter:description" content="부산일보 이상배 기자 디지털 명함">
<meta name="twitter:image" content="https://aidenleekor.github.io/c/card.jpg">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  body{ background:#eef1f6; min-height:100vh; display:flex; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif; }
  .wrap{ width:100%; max-width:430px; padding:24px 18px 40px; }

  .flip{ position:relative; perspective:1400px; }
  .flip-inner{ position:relative; width:100%; aspect-ratio:1280/717;
    transition:transform .6s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d; }
  .flip.flipped .flip-inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; width:100%; height:100%;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    border-radius:16px; overflow:hidden; background:#fff;
    box-shadow:0 10px 30px rgba(26,42,74,.18); }
  .face img{ width:100%; height:100%; object-fit:contain; display:block; }
  .back{ transform:rotateY(180deg); }
  .back img{ object-fit:cover; }

  .flip-btn{ position:absolute; top:10px; right:10px; z-index:5;
    width:38px; height:38px; border:1px solid rgba(255,255,255,.45); border-radius:50%;
    background:rgba(120,140,180,.18); color:#1f2d4d;
    -webkit-backdrop-filter:blur(9px) saturate(130%); backdrop-filter:blur(9px) saturate(130%);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .flip-btn:active{ background:rgba(120,140,180,.38); }
  .flip-btn svg{ width:20px; height:20px; }

  .guide{ margin-top:18px; padding:18px; text-align:center;
    background:#1a2a4a; border-radius:14px;
    font-size:16px; font-weight:600; color:#fff; line-height:1.6;
    box-shadow:0 6px 16px rgba(26,42,74,.25); }
  .guide b{ color:#9ec3ff; }

  .divider{ border:none; border-top:1.6px dashed rgba(26,42,74,.3); margin:38px 6px; }
  .links{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:0; align-items:stretch; }
  .col-left{ display:grid; grid-template-rows:repeat(3,1fr); gap:10px; }
  .lbtn{ display:flex; align-items:center; justify-content:flex-start; gap:9px;
    background:#fff; border:1px solid #e0e5ee; border-radius:14px; text-decoration:none;
    color:#1a2a4a; font-size:13.5px; font-weight:700; text-align:left; padding:10px 11px;
    box-shadow:0 4px 12px rgba(26,42,74,.06); line-height:1.25; }
  .lbtn:active{ background:#f3f6fb; }
  .lbtn .ic{ width:22px; height:22px; flex:0 0 22px; }
  .book{ display:block; border-radius:14px; overflow:hidden;
    box-shadow:0 8px 20px rgba(26,42,74,.15); }
  .book img{ width:100%; height:100%; object-fit:cover; display:block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flip" id="flip">
      <button class="flip-btn" id="flipBtn" type="button" aria-label="명함 뒤집기" title="명함 뒤집기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="2.5" x2="12" y2="21.5" stroke-dasharray="2.2 2.2"/>
          <path d="M9.5 6.5 L4 12 L9.5 17.5 Z"/>
          <path d="M14.5 6.5 L20 12 L14.5 17.5 Z"/>
        </svg>
      </button>
      <div class="flip-inner">
        <div class="face front"><img src="card.jpg" alt="이상배 부산일보 기자 디지털 명함"></div>
        <div class="face back"><img src="card-real.jpg" alt="이상배 부산일보 기자 실물 명함"></div>
      </div>
    </div>
    <p class="guide">위 명함을 <b>길게 눌러</b> '사진에 저장'을 선택하세요.</p>

    <hr class="divider">

    <div class="links">
      <div class="col-left">
        <a class="lbtn notion" href="https://www.notion.so/aidenleekor/20ff128f4b0581d6b095e4788cab373a" target="_blank" rel="noopener">
          <img class="ic" src="notion.jpg" alt="" aria-hidden="true">포트폴리오</a>
        <a class="lbtn insta" href="https://www.instagram.com/baesang2_?igsh=MXNsZzFyNmN4OGxkMw%3D%3D&utm_source=qr" target="_blank" rel="noopener">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F58529"/><stop offset=".5" stop-color="#DD2A7B"/><stop offset="1" stop-color="#8134AF"/></linearGradient></defs><rect x="2.5" y="2.5" width="19" height="19" rx="6" fill="none" stroke="url(#ig)" stroke-width="2.1"/><circle cx="12" cy="12" r="4.7" fill="none" stroke="url(#ig)" stroke-width="2.1"/><circle cx="17.5" cy="6.5" r="1.3" fill="url(#ig)"/></svg>인스타그램</a>
        <a class="lbtn naver" href="https://media.naver.com/journalist/082/72835" target="_blank" rel="noopener">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#03C75A"/><path d="M8.3 17V7h2.2l3 4.6V7H17v10h-2.2l-3-4.6V17z" fill="#fff"/></svg>기자 페이지</a>
      </div>
      <a class="book" href="https://product.kyobobook.co.kr/detail/S000202500518" target="_blank" rel="noopener">
        <img src="book.jpg" alt="산복빨래방 책">
      </a>
    </div>
  </div>

<script>
  var flip = document.getElementById('flip');
  document.getElementById('flipBtn').addEventListener('click', function(){
    flip.classList.toggle('flipped');
  });
</script>
</body>
</html>
