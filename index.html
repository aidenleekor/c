<!doctype html>

<title>이상배 · 부산일보</title>
<style>
  :root{ --ink:#1a2a4a; --accent:#2a5db0; --line:#e7eaf0; --muted:#6b7280; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:#eef1f6; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center; min-height:100vh; }
  .card{ width:100%; max-width:430px; background:#fff; min-height:100vh;
    display:flex; flex-direction:column; }
  .top{ background:linear-gradient(135deg,#2a5db0,#1a2a4a); color:#fff;
    padding:40px 28px 32px; }
  .org{ font-size:15px; letter-spacing:.5px; opacity:.9; font-weight:600; }
  .name{ font-size:34px; font-weight:800; margin:14px 0 6px; letter-spacing:6px; }
  .title{ font-size:15px; opacity:.92; }
  .body{ padding:8px 20px 28px; flex:1; }
  .row{ display:flex; align-items:center; gap:14px; padding:16px 8px;
    border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
  .row:last-of-type{ border-bottom:none; }
  .ico{ width:38px; height:38px; flex:0 0 38px; border-radius:50%;
    background:#eef3fb; color:var(--accent); display:flex; align-items:center;
    justify-content:center; font-size:18px; }
  .lab{ font-size:12px; color:var(--muted); display:block; }
  .val{ font-size:16px; font-weight:600; margin-top:2px; display:block; }
  .save{ display:block; margin:22px 8px 8px; padding:18px; text-align:center;
    background:var(--accent); color:#fff; font-size:17px; font-weight:700;
    border-radius:14px; text-decoration:none; box-shadow:0 6px 16px rgba(42,93,176,.3); }
  .hint{ text-align:center; font-size:12px; color:var(--muted); margin:12px 8px 0; line-height:1.5; }
</style>
</head>
<body>

    </div>
    <div class="body">
      <a class="row" href="tel:+821057566272">

      <a class="row" href="mailto:sangbae@busan.com">
        <span class="ico">✉️</span>
        <span><span class="lab">이메일</span><span class="val">sangbae@busan.com</span></span>
      </a>
      <div class="row">
        <span class="ico">📍</span>
        <span><span class="lab">주소</span><span class="val" style="font-size:14px;line-height:1.4">부산광역시 동구 중앙대로365 4층</span></span>
      </div>

      <a class="save" href="a9064951.vcf">연락처 저장하기</a>

    </div>
  </main>
</body>
</html>
