<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  body{ background:#243a59;
    background:linear-gradient(165deg,#3c577e 0%,#1f2e49 80%);
    min-height:100vh; display:flex; justify-content:center;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif; }
  .wrap{ width:100%; max-width:430px; padding:clamp(48px,12vh,120px) 18px 56px; }

  .flip{ position:relative; perspective:1400px; }
  .flip-inner{ position:relative; width:100%; aspect-ratio:1280/717;
    transition:transform .6s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d; }
  .flip.flipped .flip-inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; width:100%; height:100%;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    border-radius:18px; overflow:hidden; background:#fff;
    box-shadow:0 22px 50px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06); }
  .face img{ width:100%; height:100%; object-fit:contain; display:block; }
  .back{ transform:rotateY(180deg); }
  .back img{ object-fit:cover; }

  .flip-btn{ position:absolute; top:-18px; right:10px; z-index:5;
    width:40px; height:40px; border:1px solid rgba(255,255,255,.45); border-radius:50%;
    background:rgba(34,51,90,.32); color:#fff;
    -webkit-backdrop-filter:blur(10px) saturate(140%); backdrop-filter:blur(10px) saturate(140%);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.22); transition:transform .12s, background .12s; }
  .flip-btn:active{ background:rgba(34,51,90,.5); transform:scale(.93); }
  .flip-btn svg{ width:21px; height:21px; }

  .actions{ display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; margin-top:16px; }
  .abtn{ display:flex; align-items:center; justify-content:center; height:46px; border-radius:12px;
    text-decoration:none; font-size:14.5px; font-weight:700; color:#fff;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); }
  .abtn:active{ background:rgba(255,255,255,.2); }
  .abtn.save{ background:#fff; border-color:#fff; color:#22335a; }
  .abtn.save:active{ background:#dfe6f2; }

  .divider{ border:none; border-top:1.4px dashed rgba(255,255,255,.18); margin:36px 6px 26px; }
  .lbtn{ display:flex; align-items:center; justify-content:center; gap:10px; height:52px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); border-radius:14px;
    text-decoration:none; color:#fff; font-size:15px; font-weight:700; }
  .lbtn:active{ background:rgba(255,255,255,.16); }
  .lbtn .ic{ width:28px; height:28px; flex:0 0 28px; border-radius:7px; object-fit:cover; }
  .sns{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:10px; }
  .sbtn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; height:68px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.13); border-radius:12px;
    text-decoration:none; color:rgba(255,255,255,.92); font-size:12px; font-weight:600; }
  .sbtn:active{ background:rgba(255,255,255,.16); }
  .sbtn .sico{ width:20px; height:20px; }
</style>
